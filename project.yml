name: CalorieTracker
options:
  bundleIdPrefix: com.w7rp
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # CI overrides this with the run number so each sideloaded build is distinguishable.
    CURRENT_PROJECT_VERSION: "1"
targets:
  CalorieTracker:
    type: application
    platform: iOS
    sources: [CalorieTracker, Sharing]
    dependencies:
      - target: EasyCalWidgets
    entitlements:
      path: CalorieTracker/CalorieTracker.entitlements
      properties:
        com.apple.security.application-groups: [group.com.w7rp.calorietracker]
    info:
      path: CalorieTracker/Info.plist
      properties:
        CFBundleDisplayName: EasyCal
        # Widgets and controls open screens through easycal://scan, easycal://saved and so on.
        CFBundleURLTypes:
          - CFBundleURLName: com.w7rp.calorietracker
            CFBundleURLSchemes: [easycal]
        # XcodeGen otherwise writes a literal "1" here, which ignores the CI build number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan barcodes and photograph meals or nutrition labels.
        # A self-hosted model server (Ollama, LM Studio) on the home network is usually plain http.
        # This allows http only to local addresses; internet hosts still need https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reach an AI model server on your local network, if you set one up in Settings.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Filled in by CI so the app can show which commit it was built from.
        BuildCommit: $(BUILD_COMMIT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w7rp.calorietracker
        TARGETED_DEVICE_FAMILY: "1"
        BUILD_COMMIT: local
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EasyCalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sharing
      # Plain helpers the widgets share with the app: Macros, number formatting, rings.
      - CalorieTracker/Shared/Nutrition.swift
      - CalorieTracker/Shared/Theme.swift
    entitlements:
      path: Widgets/EasyCalWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.w7rp.calorietracker]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: EasyCal
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w7rp.calorietracker.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  CalorieTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CalorieTrackerTests]
    dependencies:
      - target: CalorieTracker
schemes:
  CalorieTracker:
    build:
      targets:
        CalorieTracker: all
    test:
      targets: [CalorieTrackerTests]
