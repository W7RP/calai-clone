name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # macOS minutes count 10x on a private repo, so keep this job lean.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        # AltStore re-signs with the free Apple ID on install, so CI doesn't sign.
        run: |
          xcodebuild build \
            -project CalorieTracker.xcodeproj \
            -scheme CalorieTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            BUILD_COMMIT=${GITHUB_SHA::7} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CalorieTracker.app Payload/
          zip -qr CalorieTracker-${{ github.run_number }}.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-${{ github.run_number }}
          path: CalorieTracker-${{ github.run_number }}.ipa
          retention-days: 14
